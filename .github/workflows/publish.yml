name: Publish

# 🔒 The owner's order, every project (workspace letter H33, D1, 2026-11-10): "the CI to check
# first, then push the tag, and then create the release page from the tag, then publish the
# package to the registry". `scripts/release.py` pushes `main` (with its `bump to vX.Y.Z` commit)
# and NOTHING else — no tag, no upload. This workflow does the rest:
#
#   push of main  →  checks  →  tag  →  release (the page)  →  dispatch
#                                                                 │  workflow_dispatch ON THE TAG
#   that dispatched run  →  build  →  publish (PyPI, OIDC, PEP 740 attestations)
#
# Why two runs: the `pypi` environment admits only `v*` refs (its deployment policy, read through
# the public API 2026-11-10), and a tag made with the job's GITHUB_TOKEN starts no run. A
# GITHUB_TOKEN may start a `workflow_dispatch`, so `dispatch` starts THIS file on the tag — the same
# workflow file PyPI's Trusted Publisher is registered for (loader-dart's measured shape, 0.3.3).
# `dispatch` then waits until PyPI lists the version, so the push run's result is the publish's.
#
# "Is this a release?" (checks): the manifest version's tag is absent on GitHub = a NEW release;
# tagged on THIS commit = a RE-RUN (each job then skips what is done); tagged elsewhere = an
# ordinary push (tag / release / dispatch skipped). A published tag never moves.
#
# Credentials (C30): each job holds only its own permission. checks / build run all package code
# with `contents: read` and token-less clones; tag / release / dispatch run only a stdlib script
# fetched BY THE COMMIT, beside their one write permission; publish holds `id-token: write` only,
# installs only twine + pypi-attestations (pinned, wheels only), and never checks out.
#
# `uses:` — only the two artifact actions, each pinned to a full commit hash (checked to be a
# commit through the GitHub API, 2026-11-08; both dated 2026-10-07, node24). Never pin by tag.
# One-time PyPI setup: Trusted Publisher Owner synapticforge1 / Repository universalWasmLoader-py /
# Workflow publish.yml / Environment pypi. The environment has no required reviewer (owner,
# 2026-11-09: "no"), so a release is the owner's `release.py` push.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "The release tag (vX.Y.Z); run FROM this tag. Normally started by `dispatch`."
        required: true
        default: ""

permissions: {}

# One run per ref at a time, QUEUED, never cancelled (C30 (2); H33 U9).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── the run started by a push of main ──────────────────────────────────────────────────────
  checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ steps.state.outputs.state }}
      tag: ${{ steps.state.outputs.tag }}
    steps:
      # Token-less (the repo is public): no credential lands in .git/config. Full history + tags:
      # the compatibility gate compares against the previous release tag.
      - name: Clone this commit (token-less)
        run: |
          git clone "https://github.com/${{ github.repository }}" .
          git checkout -q --detach "$GITHUB_SHA"
          git submodule update --init
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Is this a release?
        id: state
        run: |
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' pyproject.toml | head -n1)"
          case "$version" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::no X.Y.Z version in pyproject.toml"; exit 1 ;; esac
          tag="v$version"
          remote="$(git ls-remote --tags "https://github.com/${{ github.repository }}")"
          tagged="$(printf '%s\n' "$remote" | awk -v r="refs/tags/$tag^{}" '$2 == r { print $1 }')"
          [ -n "$tagged" ] || tagged="$(printf '%s\n' "$remote" | awk -v r="refs/tags/$tag" '$2 == r { print $1 }')"
          if [ -z "$tagged" ]; then state=new
          elif [ "$tagged" = "$GITHUB_SHA" ]; then state=rerun
          else state=none; fi
          echo "$tag: $state (tag on ${tagged:-nothing}; this commit $GITHUB_SHA)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The pixi that wrote pixi.lock. sha256 = the release's .sha256 file = GitHub's asset
      # digest = a local hash of the download (three sources, 2026-11-08).
      - name: Install pixi 0.84.1 (pinned by sha256)
        run: |
          url=https://github.com/prefix-dev/pixi/releases/download/v0.84.1/pixi-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --max-time 120 --retry 3 -o "$RUNNER_TEMP/pixi.tgz" "$url"
          echo "c81a16595e9e925fac3b12fe50cedbf415619a421ad2b72c1bba2a6ba6c2454a  $RUNNER_TEMP/pixi.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pixi-bin"
          tar -xzf "$RUNNER_TEMP/pixi.tgz" -C "$RUNNER_TEMP/pixi-bin" pixi
          echo "$RUNNER_TEMP/pixi-bin" >> "$GITHUB_PATH"

      - name: Install the locked environment
        run: pixi install --locked

      - name: Lint (ruff)
        run: pixi run lint
      - name: Type check (mypy strict)
        run: pixi run typecheck
      - name: Tests (pytest)
        run: pixi run test
      - name: API snapshot is current (compat Rule 1)
        run: pixi run python scripts/compat.py --snapshot

      # A release only: the floor and the previous tag's tests on the UNTAGGED candidate, and the
      # publish dry run (a build with the locked hatchling + twine check).
      - name: Compatibility gate (the release candidate)
        if: steps.state.outputs.state != 'none'
        run: pixi run python scripts/compat.py --release
      - name: Build + twine check (the publish dry run)
        if: steps.state.outputs.state != 'none'
        run: |
          pixi run python -m build --no-isolation
          pixi run python -m twine check dist/*
          sha256sum dist/*

  tag:
    needs: checks
    if: needs.checks.outputs.state != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag; nothing else
    steps:
      - name: CI's annotated tag (REST API; there = done, elsewhere = refused)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          curl -sSfL --max-time 60 --retry 3 -o "$RUNNER_TEMP/github_release.py" \
            "https://raw.githubusercontent.com/${{ github.repository }}/$GITHUB_SHA/scripts/github_release.py"
          python3 "$RUNNER_TEMP/github_release.py" tag --repo "${{ github.repository }}" --tag "$TAG" --sha "$GITHUB_SHA"

  release:
    needs: [checks, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the page; nothing else
    steps:
      - name: The GitHub Release page FROM the tag (REST API; H32's order)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          curl -sSfL --max-time 60 --retry 3 -o "$RUNNER_TEMP/github_release.py" \
            "https://raw.githubusercontent.com/${{ github.repository }}/$GITHUB_SHA/scripts/github_release.py"
          python3 "$RUNNER_TEMP/github_release.py" page --repo "${{ github.repository }}" --tag "$TAG" --sha "$GITHUB_SHA"

  dispatch:
    needs: [checks, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write # start publish.yml on the tag; nothing else
    steps:
      - name: Publish ON THE TAG, then wait until PyPI lists the version (fatal)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          curl -sSfL --max-time 60 --retry 3 -o "$RUNNER_TEMP/github_release.py" \
            "https://raw.githubusercontent.com/${{ github.repository }}/$GITHUB_SHA/scripts/github_release.py"
          python3 "$RUNNER_TEMP/github_release.py" dispatch --repo "${{ github.repository }}" --tag "$TAG" --sha "$GITHUB_SHA" --wait 1500

  # ── the run dispatched ON THE TAG ──────────────────────────────────────────────────────────
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the tag (token-less); the run must be ON it
        env:
          REF: ${{ github.event.inputs.ref }}
        run: |
          case "$REF" in v[0-9]*) ;; *) echo "::error::ref must be a release tag, got '$REF'"; exit 1 ;; esac
          if [ "$GITHUB_REF" != "refs/tags/$REF" ]; then
            echo "::error::dispatch this workflow ON tag $REF; it runs on $GITHUB_REF"; exit 1
          fi
          git clone --branch "$REF" "https://github.com/${{ github.repository }}" .
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' pyproject.toml | head -n1)"
          test "v$version" = "$REF"

      - name: Install pixi 0.84.1 (pinned by sha256)
        run: |
          url=https://github.com/prefix-dev/pixi/releases/download/v0.84.1/pixi-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --max-time 120 --retry 3 -o "$RUNNER_TEMP/pixi.tgz" "$url"
          echo "c81a16595e9e925fac3b12fe50cedbf415619a421ad2b72c1bba2a6ba6c2454a  $RUNNER_TEMP/pixi.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pixi-bin"
          tar -xzf "$RUNNER_TEMP/pixi.tgz" -C "$RUNNER_TEMP/pixi-bin" pixi
          echo "$RUNNER_TEMP/pixi-bin" >> "$GITHUB_PATH"

      # The gate ran in the push run's `checks` on this very commit (the tag exists only after
      # it was green); this run builds the files the publish job uploads.
      - name: Build sdist + wheel (the locked hatchling) + twine check
        run: |
          pixi install --locked
          pixi run python -m build --no-isolation
          pixi run python -m twine check dist/*
          sha256sum dist/*

      - name: Hand dist/ to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment (deployment policy: `v*` tags only; no required reviewer — owner,
    # 2026-11-09). The OIDC token carries its claim, which the PyPI Trusted Publisher requires.
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing AND the Sigstore signature; nothing else
    env:
      REF: ${{ github.event.inputs.ref }}
    steps:
      - name: The owner's order holds (the tag = this commit AND its page exists)
        run: |
          curl -sSfL --max-time 60 --retry 3 -o "$RUNNER_TEMP/github_release.py" \
            "https://raw.githubusercontent.com/${{ github.repository }}/$GITHUB_SHA/scripts/github_release.py"
          python3 "$RUNNER_TEMP/github_release.py" check --repo "${{ github.repository }}" --tag "$REF" --sha "$GITHUB_SHA"

      - name: Download dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Both scripts are fetched BY THE COMMIT (never from the build job, whose output package
      # code could change). Only HTTP 404 means "no files yet".
      - name: Which files does PyPI still need?
        run: |
          for s in pypi_files pypi_attest; do
            curl -sSfL --max-time 60 --retry 3 -o "$RUNNER_TEMP/$s.py" \
              "https://raw.githubusercontent.com/${{ github.repository }}/$GITHUB_SHA/scripts/$s.py"
          done
          sha256sum dist/*
          python3 "$RUNNER_TEMP/pypi_files.py" universal-wasm-loader "${REF#v}" dist > "$RUNNER_TEMP/upload.txt"
          echo "to upload:"; cat "$RUNNER_TEMP/upload.txt"

      # The only third-party code in this job: twine (pixi.lock's version) and pypi-attestations
      # 0.0.30 (the latest release older than two weeks on 2026-11-10; 0.0.31 was 8 days old) with
      # its sigstore — wheels only (no package runs code at install time), in their own venv.
      - name: Install twine + pypi-attestations (pinned, wheels only)
        run: |
          if [ ! -s "$RUNNER_TEMP/upload.txt" ]; then echo "nothing to upload"; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --only-binary :all: "twine==7.0.0" "pypi-attestations==0.0.30"

      - name: Sign PEP 740 attestations (Sigstore, the job's OIDC identity)
        run: |
          if [ ! -s "$RUNNER_TEMP/upload.txt" ]; then echo "nothing to sign"; exit 0; fi
          mapfile -t files < "$RUNNER_TEMP/upload.txt"
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/pypi_attest.py" "${files[@]}"
          ls -l dist/

      - name: Publish to PyPI (Trusted Publishing via OIDC; no stored token)
        run: |
          if [ ! -s "$RUNNER_TEMP/upload.txt" ]; then
            echo "$REF is already complete on PyPI — nothing uploaded, no token minted."
            exit 0
          fi
          mapfile -t files < "$RUNNER_TEMP/upload.txt"

          # 1) Ask the Actions runner for an OIDC token scoped to audience "pypi".
          resp="$(curl -sS --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")"
          OIDC_TOKEN="$(printf '%s' "$resp" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')" \
            || { echo "::error::could not obtain a GitHub OIDC token"; exit 1; }
          echo "::add-mask::$OIDC_TOKEN"
          export OIDC_TOKEN

          # 2) Exchange it at PyPI for a short-lived, project-scoped API token.
          payload="$(python3 -c 'import json,os; print(json.dumps({"token": os.environ["OIDC_TOKEN"]}))')"
          mint="$(curl -sS --max-time 30 -X POST https://pypi.org/_/oidc/mint-token -d "$payload")"
          PYPI_TOKEN="$(printf '%s' "$mint" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')" \
            || { echo "::error::PyPI did not mint a token — is the Trusted Publisher registered for this repo/workflow? Response: $mint"; exit 1; }
          echo "::add-mask::$PYPI_TOKEN"

          # 3) Upload only the missing files, each with its attestation. The token expires on its own.
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN" \
            "$RUNNER_TEMP/venv/bin/twine" upload --attestations "${files[@]}"

      # H33 U8, FATAL: every built file served by PyPI, each with a PEP 740 provenance from THIS
      # repo's publish.yml in the `pypi` environment (PyPI's integrity API). A green upload alone is
      # not proof.
      - name: Read back from PyPI (fatal)
        run: |
          python3 "$RUNNER_TEMP/pypi_files.py" readback universal-wasm-loader "${REF#v}" dist \
            --repo "${{ github.repository }}" --workflow publish.yml --environment pypi --wait 600
