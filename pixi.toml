[project]
name = "universal-wasm-loader"
# Mirrors pyproject.toml [project] version (the single source of truth that the
# bump / release / publish scripts read & write). Kept in sync by
# scripts/bump_version.py.
version = "1.1.1"
description = "Universal WASM loader for Python"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
test = "pytest tests/ -v"
lint = "ruff check src/ tests/ scripts/"
fmt = "ruff format src/ tests/"
typecheck = "mypy src/ scripts/"
# The release gate — the same three commands, in this order, as publish.yml runs before it builds.
# A test task alone is not a gate (pytest never type-checks).
gate = { depends-on = ["lint", "typecheck", "test"] }
# Versioning / release toolchain: scripts/*.py on pixi's Python (workspace tooling rule 1).
#   pixi run bump minor   |   pixi run release   |   pixi run publish --yes
bump = "python scripts/bump_version.py"
release = "python scripts/release.py"
publish = "python scripts/publish.py"

[dependencies]
python = ">=3.11,<4"

[pypi-dependencies]
universal-wasm-loader = { path = ".", editable = true }
wasmtime = ">=26.0.0"

[feature.dev.pypi-dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.9.0"
mypy = ">=1.10.0"

# Packaging toolchain — `scripts/release.py` and `scripts/publish.py`
# run `pixi run python -m build` / `... -m twine ...` inside this env.
# twine >=6.1 / packaging >=24.2: older twine rejects hatchling's PEP 639
# `License-File` (Metadata-Version 2.4) field in `twine check`.
[feature.publish.pypi-dependencies]
build = ">=1.2.0"
twine = ">=6.1.0"
packaging = ">=24.2"

[environments]
default = { features = ["dev", "publish"], solve-group = "default" }
